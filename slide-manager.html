<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>簡報順序編輯工具</title>
<style>
  :root{
    --navy:#14528C;
    --navy-deep:#0d3a63;
    --accent:#BEDFFF;
    --accent-soft:#E4F1FF;
    --paper:#FFFFFF;
    --ink:#1a1a1a;
    --muted:#6b7280;
    --border:#d8dee6;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:#eef1f5;color:var(--ink);font-family:'Microsoft JhengHei','PingFang TC',-apple-system,sans-serif;}
  header{
    background:var(--paper);
    border-bottom:1px solid var(--border);
    padding:20px 28px;
    position:sticky;top:0;z-index:20;
  }
  header h1{margin:0 0 4px;font-size:20px;color:var(--navy-deep);}
  header p{margin:0;font-size:13px;color:var(--muted);line-height:1.6;}
  .toolbar{
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    padding:16px 28px;background:#fff;border-bottom:1px solid var(--border);
    position:sticky;top:82px;z-index:19;
  }
  .btn{
    font-family:inherit;font-size:13.5px;font-weight:600;
    padding:9px 18px;border-radius:6px;border:1px solid var(--navy);
    background:#fff;color:var(--navy);cursor:pointer;
  }
  .btn:hover{background:var(--accent-soft);}
  .btn.primary{background:var(--navy);color:#fff;}
  .btn.primary:hover{background:var(--navy-deep);}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .btn:disabled:hover{background:#fff;}
  .btn.primary:disabled:hover{background:var(--navy);}
  input[type="file"]{display:none;}
  .status{font-size:12.5px;color:var(--muted);margin-left:auto;}
  .warn{
    margin:0 28px 0;
    padding:10px 16px;
    background:#fff6e5;
    border:1px solid #f0c975;
    border-radius:6px;
    font-size:12.5px;
    color:#7a5600;
    line-height:1.6;
  }
  main{padding:20px 28px 60px;max-width:1100px;margin:0 auto;}
  .empty{
    text-align:center;padding:80px 20px;color:var(--muted);font-size:14px;
  }
  .pinned-card{
    display:flex;align-items:center;gap:16px;
    background:#fff;border:1px dashed var(--border);border-radius:8px;
    padding:12px 16px;margin-bottom:14px;color:var(--muted);
  }
  .pinned-card .badge{
    background:#eee;color:#888;font-weight:700;font-size:12px;
    width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;
  }
  .pinned-card .thumb{width:96px;height:54px;flex:none;border:1px solid var(--border);border-radius:4px;overflow:hidden;background:#f5f5f5;}
  .pinned-card .thumb iframe{width:712px;height:400px;border:0;transform:scale(0.1348);transform-origin:top left;pointer-events:none;}
  .pinned-card .label{font-size:13px;font-weight:600;color:#555;}
  .pinned-card .note{font-size:11.5px;}

  #list{list-style:none;margin:0;padding:0;}
  .slide-card{
    display:flex;align-items:center;gap:14px;
    background:#fff;border:1px solid var(--border);border-radius:8px;
    padding:10px 14px;margin-bottom:10px;
    cursor:grab;
  }
  .slide-card.dragging{opacity:.35;}
  .slide-card.drag-over-top{border-top:3px solid var(--navy);}
  .slide-card.drag-over-bottom{border-bottom:3px solid var(--navy);}
  .handle{
    flex:none;color:#b7c0cc;font-size:18px;letter-spacing:2px;user-select:none;cursor:grab;padding:0 2px;
  }
  .badge{
    flex:none;background:var(--accent);border:1px solid var(--navy);color:var(--navy-deep);
    font-weight:800;font-size:13px;width:32px;height:32px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
  }
  .thumb{
    flex:none;width:128px;height:72px;border:1px solid var(--border);border-radius:4px;overflow:hidden;background:#f5f5f5;position:relative;
  }
  .thumb iframe{width:1280px;height:720px;border:0;transform:scale(0.1);transform-origin:top left;pointer-events:none;}
  .info{flex:1;min-width:0;}
  .info .label{font-size:14px;font-weight:700;color:var(--navy-deep);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .info .meta{font-size:11.5px;color:var(--muted);margin-top:2px;}
  .nudge{display:flex;flex-direction:column;gap:2px;flex:none;}
  .nudge button{
    width:26px;height:22px;border:1px solid var(--border);background:#fafafa;border-radius:4px;
    cursor:pointer;font-size:11px;color:var(--navy);line-height:1;
  }
  .nudge button:hover{background:var(--accent-soft);}
  .nudge button:disabled{opacity:.3;cursor:not-allowed;}
</style>
</head>
<body>

<header>
  <h1>簡報順序編輯工具</h1>
  <p>載入 course_intro.html，拖曳（或用上下箭頭）調整投影片順序，完成後重新產生頁碼並下載新檔案。這個工具只處理「排列順序」與「頁首頁碼」，週次等內文標籤（例如 WEEK 01）不會自動跟著改，移動章節後請自行確認內文。</p>
</header>

<div class="toolbar">
  <button class="btn primary" id="loadBtn">開啟 course_intro.html</button>
  <input type="file" id="fileInput" accept=".html,.htm">
  <button class="btn" id="resetBtn" disabled>還原原始順序</button>
  <button class="btn" id="applyBtn" disabled>重新編號並下載新檔案</button>
  <span class="status" id="status">尚未載入檔案</span>
</div>

<main>
  <div class="empty" id="emptyState">請先點「開啟 course_intro.html」載入你的簡報檔案。</div>
  <div id="editArea" style="display:none;">
    <div class="pinned-card">
      <div class="badge">1</div>
      <div class="thumb" id="titleThumb"></div>
      <div class="label">標題頁（固定在第 1 頁，不可移動）</div>
    </div>
    <ul id="list"></ul>
  </div>
</main>

<script>
  let headHTML = '';
  let defsHTML = '';
  let prefixText = '';
  let suffixText = '';
  let titleSlideHTML = '';
  let originalOrder = [];
  let order = [];
  let dragSrcIndex = null;

  const fileInput = document.getElementById('fileInput');
  const loadBtn = document.getElementById('loadBtn');
  const resetBtn = document.getElementById('resetBtn');
  const applyBtn = document.getElementById('applyBtn');
  const statusEl = document.getElementById('status');
  const emptyState = document.getElementById('emptyState');
  const editArea = document.getElementById('editArea');
  const listEl = document.getElementById('list');
  const titleThumbEl = document.getElementById('titleThumb');

  loadBtn.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', e => {
    const f = e.target.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = ev => parseFile(ev.target.result, f.name);
    reader.readAsText(f, 'utf-8');
  });

  function stripTags(html){
    const d = document.createElement('div');
    d.innerHTML = html;
    return d.textContent.trim().replace(/\s+/g, ' ');
  }

  function parseFile(text, fileName){
    try{
      const headMatch = text.match(/<head[^>]*>([\s\S]*?)<\/head>/i);
      if(!headMatch) throw new Error('找不到 <head>，確認這是 course_intro.html');
      headHTML = headMatch[1];

      const bodyIdx = text.indexOf('<body>');
      const viewportIdx = text.indexOf('<div class="viewport">');
      if(bodyIdx === -1 || viewportIdx === -1) throw new Error('找不到投影片結構，確認這是 course_intro.html');
      defsHTML = text.slice(bodyIdx + 6, viewportIdx);

      const deckTag = '<div class="deck" id="deck">';
      const deckStartIdx = text.indexOf(deckTag);
      if(deckStartIdx === -1) throw new Error('找不到 .deck 容器');
      const sectionsStart = deckStartIdx + deckTag.length;

      const re = /<section class="slide[^"]*">[\s\S]*?<\/section>/g;
      re.lastIndex = sectionsStart;
      let m, sections = [], lastEnd = sectionsStart;
      while((m = re.exec(text))){
        sections.push(m[0]);
        lastEnd = m.index + m[0].length;
      }
      if(sections.length === 0) throw new Error('沒有找到任何投影片 <section>');

      prefixText = text.slice(0, sectionsStart);
      suffixText = text.slice(lastEnd);

      titleSlideHTML = sections[0];
      originalOrder = sections.slice(1).map((html, i) => buildSlideObj(html, i));
      order = originalOrder.slice();

      statusEl.textContent = `已載入「${fileName}」，共 ${sections.length} 頁`;
      emptyState.style.display = 'none';
      editArea.style.display = 'block';
      resetBtn.disabled = false;
      applyBtn.disabled = false;

      renderTitleThumb();
      renderList();
    }catch(err){
      alert('載入失敗：' + err.message);
    }
  }

  function buildSlideObj(html, idx){
    const numMatch = html.match(/<span class="num">(\d+)<\/span>/);
    const catMatch = html.match(/<span class="cat">([^<]*)<\/span>/);
    const titleMatch = html.match(/class="h-title"[^>]*>([\s\S]*?)<\/h[12]>/);
    const eyebrowMatch = html.match(/<div class="eyebrow"[^>]*>([\s\S]*?)<\/div>/);
    const label = (titleMatch && stripTags(titleMatch[1])) ||
                  (eyebrowMatch && stripTags(eyebrowMatch[1])) ||
                  ('投影片 ' + (idx + 2));
    return {
      html,
      originalNum: numMatch ? numMatch[1] : '--',
      cat: catMatch ? catMatch[1] : '',
      label,
      uid: 'u' + idx + '_' + Math.random().toString(36).slice(2, 8)
    };
  }

  function makeThumbIframe(sectionHTML){
    const iframe = document.createElement('iframe');
    iframe.loading = 'lazy';
    iframe.sandbox = 'allow-same-origin';
    const activeHTML = sectionHTML.replace(/class="slide[^"]*"/, 'class="slide active"');
    iframe.srcdoc =
      '<!doctype html><html><head>' + headHTML +
      '<style>html,body{margin:0;background:#fff;overflow:hidden;}</style></head>' +
      '<body>' + defsHTML +
      '<div style="width:1280px;height:720px;">' + activeHTML + '</div>' +
      '</body></html>';
    return iframe;
  }

  function renderTitleThumb(){
    titleThumbEl.innerHTML = '';
    titleThumbEl.appendChild(makeThumbIframe(titleSlideHTML));
  }

  function renderList(){
    listEl.innerHTML = '';
    order.forEach((slide, i) => {
      const li = document.createElement('li');
      li.className = 'slide-card';
      li.draggable = true;
      li.dataset.uid = slide.uid;

      const handle = document.createElement('div');
      handle.className = 'handle';
      handle.textContent = '⠿';

      const badge = document.createElement('div');
      badge.className = 'badge';
      badge.textContent = i + 2;

      const thumb = document.createElement('div');
      thumb.className = 'thumb';
      thumb.appendChild(makeThumbIframe(slide.html));

      const info = document.createElement('div');
      info.className = 'info';
      const labelEl = document.createElement('div');
      labelEl.className = 'label';
      labelEl.textContent = slide.label;
      const metaEl = document.createElement('div');
      metaEl.className = 'meta';
      metaEl.textContent = '原本第 ' + slide.originalNum + ' 頁' + (slide.cat ? '　·　' + slide.cat : '');
      info.appendChild(labelEl);
      info.appendChild(metaEl);

      const nudge = document.createElement('div');
      nudge.className = 'nudge';
      const upBtn = document.createElement('button');
      upBtn.textContent = '▲';
      upBtn.disabled = i === 0;
      upBtn.addEventListener('click', () => { moveItem(i, i - 1); });
      const downBtn = document.createElement('button');
      downBtn.textContent = '▼';
      downBtn.disabled = i === order.length - 1;
      downBtn.addEventListener('click', () => { moveItem(i, i + 1); });
      nudge.appendChild(upBtn);
      nudge.appendChild(downBtn);

      li.appendChild(handle);
      li.appendChild(badge);
      li.appendChild(thumb);
      li.appendChild(info);
      li.appendChild(nudge);

      li.addEventListener('dragstart', () => {
        dragSrcIndex = i;
        li.classList.add('dragging');
      });
      li.addEventListener('dragend', () => {
        li.classList.remove('dragging');
        document.querySelectorAll('.slide-card').forEach(c => c.classList.remove('drag-over-top', 'drag-over-bottom'));
      });
      li.addEventListener('dragover', e => {
        e.preventDefault();
        const rect = li.getBoundingClientRect();
        const before = (e.clientY - rect.top) < rect.height / 2;
        li.classList.toggle('drag-over-top', before);
        li.classList.toggle('drag-over-bottom', !before);
      });
      li.addEventListener('dragleave', () => {
        li.classList.remove('drag-over-top', 'drag-over-bottom');
      });
      li.addEventListener('drop', e => {
        e.preventDefault();
        const rect = li.getBoundingClientRect();
        const before = (e.clientY - rect.top) < rect.height / 2;
        let targetIndex = i + (before ? 0 : 1);
        if(dragSrcIndex === null) return;
        if(dragSrcIndex < targetIndex) targetIndex -= 1;
        moveItem(dragSrcIndex, targetIndex);
        dragSrcIndex = null;
      });

      listEl.appendChild(li);
    });
  }

  function moveItem(from, to){
    if(to < 0 || to >= order.length || from === to) return;
    const [item] = order.splice(from, 1);
    order.splice(to, 0, item);
    renderList();
  }

  resetBtn.addEventListener('click', () => {
    order = originalOrder.slice();
    renderList();
  });

  applyBtn.addEventListener('click', () => {
    const renumbered = order.map((slide, i) => {
      const newNum = String(i + 2).padStart(2, '0');
      return slide.html.replace(/<span class="num">\d+<\/span>/, '<span class="num">' + newNum + '</span>');
    });
    const deckBody = '\n      ' + titleSlideHTML + '\n\n      ' + renumbered.join('\n\n      ') + '\n    ';
    const finalText = prefixText + deckBody + suffixText;

    const blob = new Blob([finalText], {type: 'text/html;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'course_intro.html';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

    statusEl.textContent = '已下載重新編號後的檔案，請用它覆蓋原本的 course_intro.html';
  });
</script>
</body>
</html>
